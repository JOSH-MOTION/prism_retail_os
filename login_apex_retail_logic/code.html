<input class="w-full pl-[44px] pr-base py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface focus:border-primary focus:ring-0 input-focus-ring transition-all placeholder:text-outline" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->

<script>
        // Simple Interaction Logic
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                // Mimic loading state
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
                btn.classList.add('opacity-80', 'pointer-events-none');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('opacity-80', 'pointer-events-none');
                    // In a real app, this would navigate
                }, 1500);
            });
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const glowElements = document.querySelectorAll('.fixed > div');
            glowElements[0].style.transform = `translate(${moveX}px, ${moveY}px)`;
            glowElements[1].style.transform = `translate(${-moveX}px, ${-moveY}px)`;
        });
    </script>
